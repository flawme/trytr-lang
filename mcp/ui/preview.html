<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trytr Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: var(--color-background-secondary, #f5f5f4);
      --ink: var(--color-text-primary, #202124);
      --muted: var(--color-text-secondary, #65676b);
      --line: var(--color-border-primary, #d7d7d2);
      --accent: #536b53;
      font: 14px/1.45 var(--font-sans, system-ui, sans-serif);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); }
    .app { display: grid; gap: 10px; padding: 12px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .mark {
      display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto;
      border-radius: 9px; background: var(--accent); color: #fff; font-weight: 750;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 650; }
    #status { margin: 1px 0 0; color: var(--muted); font-size: 12px; }
    .tools { display: flex; gap: 5px; }
    button, summary {
      color: var(--ink); font: inherit; cursor: pointer;
    }
    button {
      min-width: 30px; min-height: 30px; padding: 3px 8px;
      border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .canvas {
      display: grid; place-items: center; min-height: 170px; max-height: 560px;
      overflow: auto; border: 1px solid var(--line); border-radius: 10px;
      background-color: var(--surface);
      background-image: radial-gradient(color-mix(in srgb, var(--muted) 22%, transparent) 0.7px, transparent 0.7px);
      background-size: 14px 14px;
    }
    .text-canvas {
      display: none; max-width: 100%; max-height: 560px; overflow: auto;
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    }
    #parameters {
      display: none; gap: 10px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
    }
    .parameter-control { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(120px, 3fr) 4ch; align-items: center; gap: 10px; }
    .parameter-control label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .parameter-control input { width: 100%; accent-color: var(--accent); }
    .parameter-control output { font-variant-numeric: tabular-nums; text-align: right; }
    #text-output {
      width: max-content; max-width: none; max-height: none; margin: 0; padding: 12px;
      border: 0; border-radius: 0; white-space: pre; overflow: visible;
      font: 12px/1 var(--font-mono, ui-monospace, monospace);
      transform-origin: top left;
    }
    .block-sextant {
      display: inline-block; width: 1.667ch; margin-right: -0.667ch;
      transform: scaleX(0.6); transform-origin: left center;
    }
    #drawing { display: none; width: 100%; height: auto; max-height: 560px; object-fit: contain; }
    #empty { padding: 24px; color: var(--muted); text-align: center; }
    details { color: var(--muted); font-size: 12px; }
    summary { width: fit-content; }
    pre {
      max-height: 220px; margin: 8px 0 0; padding: 10px; overflow: auto;
      border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
      background: var(--surface); font: 12px/1.5 var(--font-mono, ui-monospace, monospace);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    @media (max-width: 420px) {
      .app { padding: 9px; }
      .canvas { min-height: 140px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Trytr drawing preview">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">T</span>
        <div>
          <h1>Trytr Preview</h1>
          <p id="status" role="status" aria-live="polite">Waiting for a rendered document…</p>
        </div>
      </div>
      <nav class="tools" aria-label="Preview controls">
        <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoom-reset" type="button" title="Reset zoom" aria-label="Reset zoom">Fit</button>
        <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
      </nav>
    </header>
    <section class="canvas" aria-label="Rendered Trytr drawing">
      <p id="empty">The drawing will appear here when Trytr finishes rendering.</p>
      <img id="drawing" alt="Rendered Trytr vector drawing">
    </section>
    <section class="text-canvas" id="text-canvas" aria-label="Rendered Trytr text drawing">
      <pre id="text-output"></pre>
    </section>
    <section id="parameters" aria-label="Interactive document parameters"></section>
    <details>
      <summary>Trytr source</summary>
      <pre id="source">No source received.</pre>
    </details>
  </main>
  <script>
    (() => {
      const status = document.getElementById("status");
      const empty = document.getElementById("empty");
      const drawing = document.getElementById("drawing");
      const canvas = document.querySelector(".canvas");
      const textCanvas = document.getElementById("text-canvas");
      const textOutput = document.getElementById("text-output");
      const sourceView = document.getElementById("source");
      const parametersView = document.getElementById("parameters");
      let zoom = 1;
      let ready = false;
      let canCallServerTools = false;
      let currentSource = "";
      let parameterValues = {};
      let parameterSignature = "";
      let renderTimer = 0;
      let renderGeneration = 0;

      function send(method, params = {}) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function sendSize() {
        if (!ready) return;
        send("ui/notifications/size-changed", {
          width: document.documentElement.scrollWidth,
          height: document.documentElement.scrollHeight,
        });
      }

      function request(method, params) {
        const id = `trytr-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error(`The chat host did not respond to ${method}.`));
          }, 8000);
          const onMessage = (event) => {
            if (event.source !== window.parent || event.data?.id !== id) return;
            window.removeEventListener("message", onMessage);
            window.clearTimeout(timeout);
            if (event.data.error) reject(new Error(event.data.error.message || "Host request failed"));
            else resolve(event.data.result || {});
          };
          window.addEventListener("message", onMessage);
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      }

      function setZoom(value) {
        zoom = Math.max(0.5, Math.min(2.5, value));
        drawing.style.width = `${zoom * 100}%`;
        textOutput.style.fontSize = `${12 * zoom}px`;
        document.getElementById("zoom-reset").textContent = zoom === 1 ? "Fit" : `${Math.round(zoom * 100)}%`;
      }

      function toBase64Utf8(value) {
        const bytes = new TextEncoder().encode(value);
        let binary = "";
        for (let offset = 0; offset < bytes.length; offset += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
        }
        return btoa(binary);
      }

      function showResult(result) {
        const data = result?.structuredContent;
        const text = result?.content?.find(
          (item) => item.type === "text" && typeof item.text === "string"
        )?.text;
        const textSvg = result?.content?.find(
          (item) => item.type === "text" && typeof item.text === "string" && item.text.startsWith("<svg ")
        )?.text;
        const svg = typeof data?.svg === "string" ? data.svg : textSvg;
        if ((data?.ok || textSvg) && typeof svg === "string" && svg.startsWith("<svg ")) {
          textCanvas.style.display = "none";
          canvas.style.display = "grid";
          drawing.src = `data:image/svg+xml;base64,${toBase64Utf8(svg)}`;
          drawing.style.display = "block";
          empty.style.display = "none";
          status.textContent = data.message || "Rendered successfully.";
          return;
        }
        if (data?.ok === true && result?.isError !== true && typeof text === "string") {
          textOutput.replaceChildren();
          const pendingText = [];
          let converted = 0;
          const flushText = () => {
            if (pendingText.length === 0) return;
            textOutput.append(document.createTextNode(pendingText.join("")));
            pendingText.length = 0;
          };
          for (const character of text) {
            const codePoint = character.codePointAt(0);
            if (codePoint >= 0x1fb00 && codePoint <= 0x1fb3b && converted < 5000) {
              flushText();
              const span = document.createElement("span");
              span.className = "block-sextant";
              span.textContent = character;
              textOutput.append(span);
              converted += 1;
            } else {
              pendingText.push(character);
            }
          }
          flushText();
          drawing.removeAttribute("src");
          drawing.style.display = "none";
          canvas.style.display = "none";
          textCanvas.style.display = "block";
          status.textContent = data.message || "Rendered as text.";
          return;
        }
        textCanvas.style.display = "none";
        canvas.style.display = "grid";
        const diagnostic = data?.message || text;
        status.textContent = diagnostic || "No preview data was returned.";
        drawing.removeAttribute("src");
        drawing.style.display = "none";
        empty.style.display = "block";
        empty.textContent = diagnostic || "This client returned no renderable preview data.";
      }

      function unwrapResult(value) {
        return value?.result && typeof value.result === "object" ? value.result : value;
      }

      function renderParameterControls(parameters) {
        if (!Array.isArray(parameters) || parameters.length === 0) {
          parametersView.replaceChildren();
          parameterSignature = "";
          parameterValues = {};
          parametersView.style.display = "none";
          return;
        }
        const descriptors = parameters.filter((parameter) => parameter &&
          typeof parameter.id === "string" && Number.isInteger(parameter.min) &&
          Number.isInteger(parameter.max) && Number.isInteger(parameter.step) &&
          Number.isInteger(parameter.value));
        const signature = JSON.stringify(descriptors.map(({id, label, min, max, step}) =>
          [id, label, min, max, step]));
        if (signature === parameterSignature) {
          for (const parameter of descriptors) {
            parameterValues[parameter.id] = parameter.value;
            const input = document.getElementById(`parameter-${parameter.id}`);
            const output = input?.closest(".parameter-control")?.querySelector("output");
            if (input && output && document.activeElement !== input) {
              input.value = String(parameter.value);
              output.textContent = String(parameter.value);
            }
          }
          return;
        }
        parametersView.replaceChildren();
        parameterSignature = signature;
        parameterValues = {};
        for (const parameter of descriptors) {
          parameterValues[parameter.id] = parameter.value;
          const row = document.createElement("div");
          row.className = "parameter-control";
          const label = document.createElement("label");
          label.htmlFor = `parameter-${parameter.id}`;
          label.textContent = parameter.label || parameter.id;
          const input = document.createElement("input");
          input.type = "range";
          input.id = `parameter-${parameter.id}`;
          input.min = String(parameter.min);
          input.max = String(parameter.max);
          input.step = String(parameter.step);
          input.value = String(parameter.value);
          const output = document.createElement("output");
          output.setAttribute("for", input.id);
          output.textContent = String(parameter.value);
          input.addEventListener("input", () => {
            const value = Number(input.value);
            parameterValues[parameter.id] = value;
            output.textContent = String(value);
            window.clearTimeout(renderTimer);
            renderTimer = window.setTimeout(() => rerenderWithParameters(), 180);
          });
          row.append(label, input, output);
          parametersView.append(row);
        }
        parametersView.style.display = parametersView.childElementCount ? "grid" : "none";
      }

      async function loadRenderedPreview(value, generation) {
        const result = unwrapResult(value);
        const data = result?.structuredContent;
        renderParameterControls(data?.parameters);
        const previewId = data?.previewId;
        if (typeof previewId !== "string") {
          showResult(result);
          return;
        }
        if (!canCallServerTools) {
          status.textContent = "This host did not enable calls from embedded views.";
          empty.textContent = "Use an MCP Apps host that supports app-to-server tool calls to load this drawing.";
          return;
        }
        status.textContent = "Rendered successfully. Loading the drawing…";
        try {
          const preview = unwrapResult(await request("tools/call", {
            name: "get_trytr_preview",
            arguments: { previewId },
          }));
          if (generation === renderGeneration) showResult(preview);
        } catch (error) {
          if (generation !== renderGeneration) return;
          status.textContent = "The preview host could not load the drawing.";
          empty.textContent = error.message;
        }
      }

      async function rerenderWithParameters() {
        if (!currentSource || !canCallServerTools) return;
        const generation = ++renderGeneration;
        status.textContent = "Updating the drawing…";
        try {
          const result = await request("tools/call", {
            name: "render_trytr",
            arguments: { source: currentSource, parameters: { ...parameterValues } },
          });
          if (generation === renderGeneration) await loadRenderedPreview(result, generation);
        } catch (error) {
          if (generation !== renderGeneration) return;
          status.textContent = "The updated drawing could not be rendered.";
          empty.textContent = error.message;
        }
      }

      function applyHostContext(context) {
        if (context?.theme === "dark" || context?.theme === "light") {
          document.documentElement.dataset.theme = context.theme;
        }
        const variables = context?.styles?.variables;
        if (variables && typeof variables === "object") {
          for (const [name, value] of Object.entries(variables)) {
            if (name.startsWith("--") && typeof value === "string") {
              document.documentElement.style.setProperty(name, value);
            }
          }
        }
      }

      document.getElementById("zoom-out").addEventListener("click", () => setZoom(zoom - 0.15));
      document.getElementById("zoom-in").addEventListener("click", () => setZoom(zoom + 0.15));
      document.getElementById("zoom-reset").addEventListener("click", () => setZoom(1));

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
        const { method, params } = event.data;
        if (method === "ui/notifications/tool-input" && typeof params?.arguments?.source === "string") {
          currentSource = params.arguments.source;
          sourceView.textContent = params.arguments.source;
        } else if (method === "ui/notifications/tool-result") {
          const generation = ++renderGeneration;
          void loadRenderedPreview(params, generation);
        } else if (method === "ui/notifications/host-context-changed") {
          applyHostContext(params);
        }
      });

      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: { name: "trytr-preview", version: "0.1.0" },
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      }).then((initializeResult) => {
        applyHostContext(initializeResult.hostContext);
        canCallServerTools = Boolean(initializeResult.hostCapabilities?.serverTools);
        ready = true;
        send("ui/notifications/initialized");
        sendSize();
      }).catch((error) => {
        status.textContent = "Embedded preview needs an MCP Apps-capable chat host.";
        empty.textContent = error.message;
      });

      if ("ResizeObserver" in window) {
        new ResizeObserver(sendSize).observe(document.body);
      }
    })();
  </script>
</body>
</html>
