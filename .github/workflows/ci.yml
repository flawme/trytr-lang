name: C build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc clang python3
      - name: Configure
        # Ubuntu's AppArmor policy covers the installed stable Chrome binary.
        # Use that installation so PDF tests can run with its sandbox enabled.
        run: |
          test -x /opt/google/chrome/chrome
          cmake --preset ${{ matrix.preset }} -DTRYTR_CHROMIUM_EXECUTABLE=/opt/google/chrome/chrome
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Package release binaries
        if: matrix.preset == 'release'
        run: cpack --config build/release/CPackConfig.cmake -B build/packages
      - name: Check source archive on the clean runner
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        run: |
          release_version=$(build/release/trytr --version)
          release_version=${release_version#trytr }
          git archive --format=tar.gz --prefix="trytr-${release_version}/" --output="build/packages/trytr-${release_version}-source.tar.gz" HEAD
          mkdir -p build/archive-source
          tar -xzf "build/packages/trytr-${release_version}-source.tar.gz" -C build/archive-source
          cmake -S "build/archive-source/trytr-${release_version}" -B build/archive-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTRYTR_CHROMIUM_EXECUTABLE=/opt/google/chrome/chrome
          cmake --build build/archive-build --parallel 2
          ctest --test-dir build/archive-build --output-on-failure
          cd build/packages
          sha256sum *.tar.gz > SHA256SUMS
      - name: Retain verified release assets
        if: matrix.preset == 'release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trytr-release-assets
          path: |
            build/packages/*.tar.gz
            build/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
